[package]
name = "paloma"
version = "0.1.0"
description = "Paloma · 桌面 Agent 小精灵"
edition = "2021"

# Tauri v2 依赖：默认 feature 关掉 packagemanager 类能力，保持最小。
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
